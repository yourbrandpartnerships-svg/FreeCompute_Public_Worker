name: Cloud Kaggle Credential Presence Probe

on:
  push:
    branches:
      - audit/cloud-kaggle-control-20260927
    paths:
      - .github/workflows/cloud-kaggle-credential-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      KAGGLE_API_TOKEN_VALUE: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME_VALUE: ${{ secrets.KAGGLE_USERNAME }}
      FC_KAGGLE_OWNER_TOKEN_VALUE: ${{ secrets.FC_KAGGLE_OWNER_API_TOKEN }}
      FC_KAGGLE_OWNER_USERNAME_VALUE: ${{ secrets.FC_KAGGLE_OWNER_USERNAME }}
      FC_KAGGLE_COLLAB1_TOKEN_VALUE: ${{ secrets.FC_KAGGLE_COLLAB1_API_TOKEN }}
      FC_KAGGLE_COLLAB1_USERNAME_VALUE: ${{ secrets.FC_KAGGLE_COLLAB1_USERNAME }}
      FC_KAGGLE_COLLAB2_TOKEN_VALUE: ${{ secrets.FC_KAGGLE_COLLAB2_API_TOKEN }}
      FC_KAGGLE_COLLAB2_USERNAME_VALUE: ${{ secrets.FC_KAGGLE_COLLAB2_USERNAME }}
      SHOREA_READ_TOKEN_VALUE: ${{ secrets.SHOREA_READ_TOKEN }}

    steps:
      - name: Report presence only
        shell: python
        run: |
          import os, json
          names=[
              "KAGGLE_API_TOKEN_VALUE",
              "KAGGLE_USERNAME_VALUE",
              "FC_KAGGLE_OWNER_TOKEN_VALUE",
              "FC_KAGGLE_OWNER_USERNAME_VALUE",
              "FC_KAGGLE_COLLAB1_TOKEN_VALUE",
              "FC_KAGGLE_COLLAB1_USERNAME_VALUE",
              "FC_KAGGLE_COLLAB2_TOKEN_VALUE",
              "FC_KAGGLE_COLLAB2_USERNAME_VALUE",
              "SHOREA_READ_TOKEN_VALUE",
          ]
          result={name: bool(os.environ.get(name)) for name in names}
          print("CLOUD_KAGGLE_SECRET_PRESENCE="+json.dumps(result,sort_keys=True))
          assert all(not os.environ.get(name, "").startswith("ghp_") for name in names)
