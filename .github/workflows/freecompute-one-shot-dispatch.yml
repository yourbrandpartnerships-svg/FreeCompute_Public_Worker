name: FreeCompute One-Shot Canary Dispatcher

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/freecompute-one-shot-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch unchanged reviewed provider canary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          FC_NONCE: a1b2c3d4e5f6
        run: |
          set -euo pipefail
          payload=$(printf '{"ref":"main","inputs":{"nonce":"%s"}}' "$FC_NONCE")
          curl -fsS -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/freecompute-provider-canary.yml/dispatches"             -d "$payload"
          echo "FREECOMPUTE_ONE_SHOT_DISPATCH_OK:$FC_NONCE"
