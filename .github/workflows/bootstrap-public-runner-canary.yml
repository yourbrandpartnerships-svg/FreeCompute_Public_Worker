name: Bootstrap Public Runner Canary

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-public-runner-canary.yml

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify public standard runner
        shell: bash
        run: |
          set -euo pipefail
          echo "FREECOMPUTE_PUBLIC_RUNNER_BOOTSTRAP_OK"
