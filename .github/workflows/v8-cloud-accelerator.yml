name: V8 Cloud Accelerator

on:
  push:
    branches:
      - main
      - feature/v8-cloud-accelerator-20260927
      - fix/v8-public-worker-freecompute-boundary-20260928
    paths:
      - scripts/v8_cloud_accelerator.py
      - .github/workflows/v8-cloud-accelerator.yml
      - README.md
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v8-cloud-accelerator
  cancel-in-progress: true

jobs:
  accelerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout public worker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Enforce public-worker provider boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          workflow=Path(".github/workflows/v8-cloud-accelerator.yml").read_text(encoding="utf-8")
          script=Path("scripts/v8_cloud_accelerator.py").read_text(encoding="utf-8")
          forbidden=(
              "FC_KAGGLE_",
              "KAGGLE_API_TOKEN",
              "KAGGLE_USERNAME",
              "kernels push",
              "kaggle quota",
          )
          combined=workflow+"\n"+script
          for marker in forbidden:
              if marker in combined:
                  raise SystemExit(f"PUBLIC_WORKER_PROVIDER_BOUNDARY_FAIL:{marker}")
          assert '"authority": "FREECOMPUTE_ONLY"' in script
          assert '"gpu_verified": False' in script
          print("PUBLIC_WORKER_PROVIDER_BOUNDARY=PASS")
          PY

      - name: Run public synthetic CPU evidence farm
        shell: bash
        run: |
          set -euo pipefail
          python scripts/v8_cloud_accelerator.py

      - name: Validate bounded evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path("evidence/v8-cloud/latest.json").read_text(encoding="utf-8"))
          required=(
              "source","checkpoint","candidate_sha","workload_family","support_only",
              "authoritative_merge_gate","private_source_used","paid_compute_used",
              "credential_boundary","runtime_type","cpu_count","gpu_count",
              "gpu_verified","quota_before","quota_after","scenario_count",
              "pass_rate","confidence_interval","artifact_hash","generated_at","expires_at",
          )
          missing=[key for key in required if key not in payload]
          if missing:
              raise SystemExit("PUBLIC_EVIDENCE_MANIFEST_MISSING:"+",".join(missing))
          assert payload["support_only"] is True
          assert payload["authoritative_merge_gate"] is False
          assert payload["private_source_used"] is False
          assert payload["paid_compute_used"] is False
          assert payload["gpu_verified"] is False
          assert payload["provider_compute"]["authority"] == "FREECOMPUTE_ONLY"
          assert payload["github_hosted_cpu"]["wilson_lower_95"] >= 0.99
          print("PUBLIC_EVIDENCE_MANIFEST=PASS")
          PY

      - name: Persist sanitized accelerator evidence
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "freecompute-cloud-worker"
          git config user.email "freecompute-cloud-worker@users.noreply.github.com"

          mkdir -p "$RUNNER_TEMP/v8-evidence-sync/state" "$RUNNER_TEMP/v8-evidence-sync/evidence/v8-cloud"
          cp state/v8_cloud_rotation.json "$RUNNER_TEMP/v8-evidence-sync/state/v8_cloud_rotation.json"
          cp evidence/v8-cloud/latest.json "$RUNNER_TEMP/v8-evidence-sync/evidence/v8-cloud/latest.json"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            mkdir -p state evidence/v8-cloud
            cp "$RUNNER_TEMP/v8-evidence-sync/state/v8_cloud_rotation.json" state/v8_cloud_rotation.json
            cp "$RUNNER_TEMP/v8-evidence-sync/evidence/v8-cloud/latest.json" evidence/v8-cloud/latest.json

            git add state/v8_cloud_rotation.json evidence/v8-cloud/latest.json
            if git diff --cached --quiet; then
              echo "No accelerator state/evidence change."
              exit 0
            fi

            git commit -m "evidence: refresh V8 public CPU support"
            if git push origin HEAD:main; then
              echo "V8_CLOUD_EVIDENCE_PERSISTED=PASS"
              exit 0
            fi

            echo "Push raced with a newer main commit; retrying from latest origin/main."
            sleep $((attempt * 2))
          done

          echo "Unable to persist cloud evidence after three race-safe attempts." >&2
          exit 1

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-cloud-accelerator-${{ github.run_id }}
          path: |
            evidence/v8-cloud/latest.json
            state/v8_cloud_rotation.json
          retention-days: 14
          if-no-files-found: warn
